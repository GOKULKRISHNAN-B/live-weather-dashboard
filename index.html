<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <h1>Weather Dashboard</h1>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>

        <div id="loading" class="loading hidden"></div>

        <div id="weather-info" class="weather-info hidden">
            <h2 id="city-name">City Name</h2>
            <p id="weather-desc">Condition</p>
            <div class="temp-display">
                <span id="temperature">--</span>°C
            </div>
            <div class="details">
                <p>Humidity: <span id="humidity">--</span>%</p>
                <p>Wind: <span id="wind-speed">--</span> m/s</p>
            </div>
        </div>
        <p id="error-msg" class="error-msg hidden">City not found. Please try again.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
